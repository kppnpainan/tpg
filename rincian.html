<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rincian Penyaluran – Pengguna</title>
<link rel="stylesheet" href="style.css">

<script>
// Proteksi login
if(sessionStorage.getItem("logged") !== "yes"){
    location.href = "login.html";
}
</script>
</head>

<body>

<button class="btn btn-back" onclick="location.href='index.html'">⬅ Kembali</button>
<div class="page-title">Rincian Penyaluran – Pengguna</div>

<div class="card">

    <!-- FILTER + Tombol Tersusun Rapi -->
    <div class="filters" style="justify-content:center; flex-wrap:wrap; gap:10px;">

        <select id="jenisFilter">
            <option value="ALL">Semua</option>
            <option value="TPG">TPG</option>
            <option value="TKG">TKG</option>
            <option value="Tamsil">Tamsil</option>
        </select>

        <select id="triwulanFilter">
            <option value="ALL">Semua Triwulan</option>
            <option value="1">Triwulan I</option>
            <option value="2">Triwulan II</option>
            <option value="3">Triwulan III</option>
            <option value="4">Triwulan IV</option>
        </select>

        <select id="tahunFilter">
            <option value="2025">2025</option>
            <option value="2026">2026</option>
        </select>

        <!-- Tombol Sejajar -->
        <button class="btn btn-primary" onclick="loadData()">Tampilkan</button>
        <button class="btn btn-danger" onclick="location.href='logout.html'">Logout</button>
    </div>
</div>

<div class="table-wrapper">
<table id="tabelData">
    <thead>
        <tr>
            <th>Jenis</th>
            <th>No SP2D</th>
            <th>Tanggal</th>
            <th>Bruto</th>
            <th>PPh</th>
            <th>JKN</th>
            <th>Penerima</th>
            <th>Detail</th>
        </tr>
    </thead>
    <tbody><tr><td colspan="8">Memuat...</td></tr></tbody>

    <tfoot>
        <tr>
            <td colspan="3">TOTAL</td>
            <td id="sumBrutoCell">0</td>
            <td id="sumPPhCell">0</td>
            <td id="sumJknCell">0</td>
            <td id="sumJmlCell">0</td>
            <td>-</td>
        </tr>
    </tfoot>
</table>
</div>

<script src="rincian_core.js"></script>

</body>
</html>
