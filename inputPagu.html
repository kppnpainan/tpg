<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Input Pagu – KPPN Painan</title>

<style>
  body {
    font-family: Calibri, Arial;
    background:#f2f4f8;
    margin:0;
    padding:40px 20px;
    color:#333;
  }

  h2 {
    text-align:center;
    font-size:24px;
    margin-bottom:25px;
    text-decoration:underline;
  }

  .form-box {
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
  }

  label {
    font-weight:bold;
    margin-bottom:5px;
    display:block;
  }

  input {
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:18px;
    font-size:15px;
  }

  button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2a9d8f;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
  }

  button:hover {
    background:#21867b;
    transform:scale(1.02);
  }

  .back-btn {
    margin-top:15px;
    background:#1d3557 !important;
  }
  .back-btn:hover {
    background:#16324f !important;
  }
</style>
</head>

<body>

<h2>Input Pagu Penyaluran</h2>

<div class="form-box">
  <label>Pagu TPG</label>
  <input type="number" id="paguTPG" placeholder="Masukkan pagu TPG">

  <label>Pagu Tamsil</label>
  <input type="number" id="paguTamsil" placeholder="Masukkan pagu Tamsil">

  <label>Pagu TKG</label>
  <input type="number" id="paguTKG" placeholder="Masukkan pagu TKG">

  <button onclick="kirimPagu()">Simpan Pagu</button>

  <button class="back-btn" onclick="window.location.href='index.html'">Kembali</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyJ7hZfLegv0W69I7t77H-qFfEL-pMqKKefLX3JCYgZAJLb9wxMep0aui3ObM5m_7MFqA/exec";  // ganti setelah deploy Web App

async function kirimPagu() {
  const tpg = document.getElementById("paguTPG").value;
  const tamsil = document.getElementById("paguTamsil").value;
  const tkg = document.getElementById("paguTKG").value;

  if (!tpg || !tamsil || !tkg) {
    alert("Semua kolom harus diisi!");
    return;
  }

  const data = {
    pagu_tpg: tpg,
    pagu_tamsil: tamsil,
    pagu_tkg: tkg
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data),
      headers: { "Content-Type": "application/json" }
    });

    const hasil = await res.json();

    if (hasil.status === "success") {
      alert("Pagu berhasil diperbarui!");
    } else {
      alert("Gagal menyimpan: " + hasil.message);
    }

  } catch (e) {
    alert("Terjadi kesalahan saat menyimpan.");
    console.error(e);
  }
}
</script>

</body>
</html>
