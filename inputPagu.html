<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Pagu – Admin</title>
<link rel="stylesheet" href="style.css">

<script>
// =============================
// PROTEKSI HALAMAN
// =============================
if (sessionStorage.getItem("logged") !== "yes") {
    location.href = "login.html";
}
if (sessionStorage.getItem("role") !== "Admin") {
    location.href = "rincian.html";
}
</script>

<style>
/* Tambahan styling agar identik dengan rincian2.html */
.card {
    max-width: 550px;
    margin: auto;
    padding: 25px;
    border-radius: 16px;
    background: white;
    box-shadow: var(--shadow);
}

.page-title {
    text-align: center;
    background: var(--blue-dark);
    padding: 14px;
    color: white;
    border-radius: 12px;
    margin-bottom: 24px;
    font-size: 22px;
}

label {
    font-weight: 600;
    margin-top: 12px;
    display: block;
}

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cfd3d8;
    margin-top: 6px;
    margin-bottom: 15px;
    font-size: 15px;
}

.success, .error {
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    text-align: center;
    margin-top: 15px;
}
.success { background: #d4edda; color: #155724; }
.error { background: #f8d7da; color: #721c24; }

.buttons-top {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

@media(max-width:600px){
    .buttons-top { flex-direction: column; }
    .btn { width: 100%; }
}
</style>
</head>

<body>

<!-- Tombol kembali & logout -->
<div class="buttons-top">
    <button class="btn btn-back" onclick="location.href='rincian2.html'">⬅ Kembali</button>
    <button class="btn btn-back" onclick="logout()">Logout</button>
</div>

<div class="page-title">Input Pagu – TPG / Tamsil / TKG</div>

<div class="card">

    <form id="paguForm">

        <label for="tahun">Tahun</label>
        <select id="tahun" required>
            <option value="">-- Pilih Tahun --</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
        </select>

        <label for="paguTPG">Pagu TPG</label>
        <input type="number" id="paguTPG" required min="0" placeholder="Contoh: 100000000">

        <label for="paguTamsil">Pagu Tamsil</label>
        <input type="number" id="paguTamsil" required min="0" placeholder="Contoh: 50000000">

        <label for="paguTKG">Pagu TKG</label>
        <input type="number" id="paguTKG" required min="0" placeholder="Contoh: 25000000">

        <button type="submit" class="btn btn-primary" id="submitButton">Simpan Pagu</button>
    </form>

    <div id="message"></div>
</div>

<script>
const WEB_APP_URL = 
"https://script.google.com/macros/s/AKfycbwd_M-ixxA4dZptciMVF2GJS2g-Jk3xDfx4FgajkF7a9EBr4wiXJ9p6uc2QzZyeR-3S6A/exec";

const form = document.getElementById("paguForm");
const messageBox = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
        tahun: document.getElementById("tahun").value,
        paguTPG: document.getElementById("paguTPG").value,
        paguTamsil: document.getElementById("paguTamsil").value,
        paguTKG: document.getElementById("paguTKG").value,
        mode: "inputPagu"
    };

    submitButton.disabled = true;
    submitButton.innerText = "Mengirim...";

    try {
        const response = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(data),
        });

        const text = await response.text();

        messageBox.innerHTML = `<div class="success">${text}</div>`;

        // Redirect otomatis setelah 1.5 detik
        setTimeout(() => {
            location.href = "rincian2.html";
        }, 1500);

    } catch (err) {
        messageBox.innerHTML = `<div class="error">Gagal mengirim data: ${err}</div>`;
    }

    submitButton.disabled = false;
    submitButton.innerText = "Simpan Pagu";
});

function logout() {
    sessionStorage.clear();
    location.href = "login.html";
}
</script>

</body>
</html>
