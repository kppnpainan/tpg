<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – KPPN Painan</title>
<link rel="stylesheet" href="style.css">

<style>
/* Spinner */
.loader {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #1d3557;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: spin 1s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

</head>

<body>

<div class="page-title">Login Pengguna</div>

<div class="card" style="max-width:420px; margin:auto;">

    <div id="err" style="color:red; text-align:center; display:none;"></div>

    <input type="text" id="user" placeholder="User" class="input" style="width:93%; padding:12px; margin-bottom:12px;">
    <input type="password" id="pass" placeholder="Password" class="input" style="width:93%; padding:12px; margin-bottom:12px;">

    <button id="btnLogin" class="btn btn-primary" style="width:100%;" onclick="login()">Masuk</button>
    <button class="btn btn-back" style="width:100%; margin-top:10px;" onclick="location.href='index.html'">Kembali</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyyFbErL99uPMOI4-ps8Q3ZAWetJ-W3tPyQSzvYeuioeJqAbsYmKCLdrwzgbJuqQ0gpwA/exec";

function setLoading(state){
    const btn = document.getElementById("btnLogin");

    if(state){
        btn.disabled = true;
        btn.innerHTML = `<span class="loader"></span> Sedang divalidasi...`;
    } else {
        btn.disabled = false;
        btn.innerHTML = "Masuk";
    }
}

async function login(){
    const u = document.getElementById("user").value.trim();
    const p = document.getElementById("pass").value.trim();

    if(!u || !p){
        showErr("Isi username & password!");
        return;
    }

    setLoading(true); // tampilkan loading

    try {
        const url = `${API}?mode=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`;
        const res = await fetch(url);
        const data = await res.json();

        if(data.status !== "ok"){
            showErr("User atau password salah!");
            setLoading(false);
            return;
        }

        // Simpan login session
        sessionStorage.setItem("logged", "yes");
        sessionStorage.setItem("role", data.wewenang);

        // Redirect
        if(data.wewenang === "Admin"){
            window.location.href = "rincian2.html";
        } else {
            window.location.href = "rincian.html";
        }

    } catch (e){
        console.error("ERROR LOGIN:", e);
        showErr("Gagal terhubung ke server login!");
        setLoading(false);
    }
}

function showErr(msg){
    const err = document.getElementById("err");
    err.innerHTML = msg;
    err.style.display = "block";
}
</script>

</body>
</html>
