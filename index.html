<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard TPG TKG Tamsil – KPPN Painan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body{
        font-family: Calibri, Arial;
        background:#eef2f7;
        margin:0;
        padding:20px;
        color:#333;
    }
    h2{
        text-align:center;
        background:#1d3557;
        color:white;
        padding:15px;
        border-radius:8px;
        margin-bottom:25px;
    }
    .filters{
        display:flex;
        gap:10px;
        justify-content:center;
        flex-wrap:wrap;
        margin-bottom:20px;
    }
    select{
        padding:8px 12px;
        border-radius:6px;
        border:1px solid #888;
    }
    table{
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
        background:white;
        border-radius:8px;
        overflow:hidden;
    }
    th,td{
        padding:10px;
        border-bottom:1px solid #ddd;
        text-align:center;
    }
    th{
        background:#457b9d;
        color:white;
    }

    /* >>>>>>>>>>> 3 GRAPH IN 1 ROW  <<<<<<<<<<< */

    .charts-container{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:20px;
        margin-top:25px;
    }

    @media(max-width:1200px){
        .charts-container{
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media(max-width:768px){
        .charts-container{
            grid-template-columns: 1fr;
        }
    }

    .chartBox{
        background:white;
        padding:15px;
        border-radius:8px;
        text-align:center;
        box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    /* Pie chart shrink */
    .pie-wrapper{
        width:220px;
        margin:auto;
    }

    .btn{
        margin-top:25px;
        display:block;
        width:100%;
        padding:12px;
        background:#1d3557;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
    }
</style>
</head>

<body>

<h2>Penyaluran TPG, TKG dan Tamsil lingkup KPPN Painan</h2>

<!-- FILTER -->
<div class="filters">
    <select id="filterJenis">
        <option value="Semua">Semua Jns</option>
        <option value="TPG">TPG</option>
        <option value="TKG">TKG</option>
        <option value="Tamsil">Tamsil</option>
    </select>

    <select id="filterTw">
        <option value="Semua">Semua Trw</option>
        <option value="1">Triwulan I</option>
        <option value="2">Triwulan II</option>
        <option value="3">Triwulan III</option>
        <option value="4">Triwulan IV</option>
    </select>

    <select id="filterTh">
        <option value="2025">2025</option>
        <option value="2026">2026</option>
    </select>
</div>

<!-- TABLE -->
<table>
    <thead>
        <tr>
            <th>Jenis</th>
            <th>Pagu</th>
            <th>Realisasi</th>
            <th>Jumlah Penerima</th>
            <th>PPh</th>
            <th>JKN</th>
            <th>Persentase</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<div class="charts-container">

    <!-- Chart 1 -->
    <div class="chartBox">
        <h3>Pagu vs Realisasi</h3>
        <canvas id="barChart"></canvas>
    </div>

    <!-- Chart 2 -->
    <div class="chartBox">
        <h3>Penerima</h3>
        <div class="pie-wrapper">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <!-- Chart 3 -->
    <div class="chartBox">
        <h3>Realisasi vs PPh vs JKN</h3>
        <canvas id="pphChart"></canvas>
    </div>

</div>

<button class="btn" onclick="gotoDetail()">Cek Detil Data</button>

<script>
const API = "https://script.google.com/macros/s/AKfycbyyFbErL99uPMOI4-ps8Q3ZAWetJ-W3tPyQSzvYeuioeJqAbsYmKCLdrwzgbJuqQ0gpwA/exec";

let sheet1 = [];
let sheet2 = [];

let barChart, pieChart, pphChart;

window.onload = async () => {
    await loadData();
    applyFilter();
};

async function loadData(){
    const s1 = await fetch(API+"?mode=sheet1").then(r=>r.json());
    const s2 = await fetch(API+"?mode=sheet2").then(r=>r.json());

    sheet1 = s1.data ?? [];
    sheet2 = s2.data ?? [];
}

document.querySelectorAll("select").forEach(sel=>{
    sel.addEventListener("change", applyFilter);
});

function applyFilter(){
    const jenis = document.getElementById("filterJenis").value;
    const tahun = document.getElementById("filterTh").value;
    const tw = document.getElementById("filterTw").value;

    let data = sheet1;

    data = data.filter(d => {
        let tgl = new Date(d["Tanggal SP2D"]);
        return String(tgl.getFullYear()) === tahun;
    });

    if(jenis !== "Semua")
        data = data.filter(d => d.Jenis === jenis);

    if(tw !== "Semua"){
        data = data.filter(d => {
            let m = new Date(d["Tanggal SP2D"]).getMonth()+1;
            return Math.ceil(m/3) == tw;
        });
    }

    renderTable(data);
    renderCharts(data);
}

function renderTable(data){
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    let pagu = {
        "TPG": Number(sheet2[0]["Pagu TPG"]) || 0,
        "Tamsil": Number(sheet2[0]["Pagu Tamsil"]) || 0,
        "TKG": Number(sheet2[0]["Pagu TKG"]) || 0
    };

    let realisasi = { TPG:0, Tamsil:0, TKG:0 };
    let penerima = { TPG:0, Tamsil:0, TKG:0 };
    let pph = { TPG:0, Tamsil:0, TKG:0 };
    let jkn = { TPG:0, Tamsil:0, TKG:0 };

    data.forEach(d=>{
        let bruto = Number(String(d.Bruto).replace(/[^0-9]/g,"")) || 0;
        let jml = Number(d.Jml) || 0;
        let potPPh = Number(String(d.PPh).replace(/[^0-9]/g,"")) || 0;
        let potJkn = Number(String(d.Jkn).replace(/[^0-9]/g,"")) || 0;

        realisasi[d.Jenis] += bruto;
        penerima[d.Jenis] += jml;
        pph[d.Jenis] += potPPh;
        jkn[d.Jenis] += potJkn;
    });

    ["TPG","TKG","Tamsil"].forEach(j=>{
        let pg = pagu[j] ?? 0;
        let rl = realisasi[j];
        let jml = penerima[j];
        let pot1 = pph[j];
        let pot2 = jkn[j];
        let persen = pg>0 ? ((rl/pg)*100).toFixed(1)+"%" : "-";

        tbody.innerHTML += `
            <tr>
                <td>${j}</td>
                <td>${pg.toLocaleString()}</td>
                <td>${rl.toLocaleString()}</td>
                <td>${jml.toLocaleString()}</td>
                <td>${pot1.toLocaleString()}</td>
                <td>${pot2.toLocaleString()}</td>
                <td>${persen}</td>
            </tr>
        `;
    });
}

function renderCharts(data){
    let real = {TPG:0, TKG:0, Tamsil:0};
    let count = {TPG:0, TKG:0, Tamsil:0};
    let pph = {TPG:0, TKG:0, Tamsil:0};
    let jkn = {TPG:0, TKG:0, Tamsil:0};

    data.forEach(d=>{
        real[d.Jenis] += Number(String(d.Bruto).replace(/[^0-9]/g,"")) || 0;
        count[d.Jenis] += Number(d.Jml) || 0;
        pph[d.Jenis] += Number(String(d.PPh).replace(/[^0-9]/g,"")) || 0;
        jkn[d.Jenis] += Number(String(d.Jkn).replace(/[^0-9]/g,"")) || 0;
    });

    let pagu = [
        Number(sheet2[0]["Pagu TPG"]) || 0,
        Number(sheet2[0]["Pagu TKG"]) || 0,
        Number(sheet2[0]["Pagu Tamsil"]) || 0
    ];

    if(barChart) barChart.destroy();
    barChart = new Chart(document.getElementById("barChart"), {
        type:"bar",
        data:{
            labels:["TPG","TKG","Tamsil"],
            datasets:[
                { label:"Pagu", data:pagu, backgroundColor:"#8ecae6" },
                { label:"Realisasi", data:[real.TPG,real.TKG,real.Tamsil], backgroundColor:"#1d3557" }
            ]
        }
    });

    if(pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById("pieChart"), {
        type:"pie",
        data:{
            labels:["TPG","TKG","Tamsil"],
            datasets:[
                {
                    data:[count.TPG,count.TKG,count.Tamsil],
                    backgroundColor:["#1d3557","#457b9d","#a8dadc"]
                }
            ]
        }
    });

    if(pphChart) pphChart.destroy();
    pphChart = new Chart(document.getElementById("pphChart"), {
        type:"bar",
        data:{
            labels:["TPG","TKG","Tamsil"],
            datasets:[
                { label:"Realisasi", data:[real.TPG,real.TKG,real.Tamsil], backgroundColor:"#1d3557" },
                { label:"PPh", data:[pph.TPG,pph.TKG,pph.Tamsil], backgroundColor:"#e76f51" },
                { label:"JKN", data:[jkn.TPG,jkn.TKG,jkn.Tamsil], backgroundColor:"#2a9d8f" }
            ]
        }
    });
}

function gotoDetail(){
    window.location.href = "login.html";
}
</script>

</body>
</html>
