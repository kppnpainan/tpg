<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard TPG TKG Tamsil – KPPN Painan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body{
        font-family: Calibri, Arial;
        background:#eef2f7;
        margin:0;
        padding:20px;
        color:#333;
    }
    h2{
        text-align:center;
        background:#1d3557;
        color:white;
        padding:15px;
        border-radius:8px;
        margin-bottom:25px;
    }
    .filters{
        display:flex;
        gap:10px;
        justify-content:center;
        flex-wrap:wrap;
        margin-bottom:15px;
    }
    select{
        padding:8px 12px;
        border-radius:6px;
        border:1px solid #888;
    }

    /* LOADING */
    #loadingBox{
        display:none;
        text-align:center;
        font-size:18px;
        padding:12px;
        margin-bottom:15px;
        color:#444;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:10px;
        background:white;
        border-radius:8px;
        overflow:hidden;
    }
    th,td{
        padding:10px;
        border-bottom:1px solid #ddd;
        text-align:center;
    }
    th{
        background:#457b9d;
        color:white;
    }

    .charts-container{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:20px;
        margin-top:25px;
    }
    @media(max-width:1200px){
        .charts-container{
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media(max-width:768px){
        .charts-container{
            grid-template-columns: 1fr;
        }
    }

    .chartBox{
        background:white;
        padding:15px;
        border-radius:8px;
        text-align:center;
        box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }
    .pie-wrapper{
        width:220px;
        margin:auto;
    }
    .btn{
        margin-top:25px;
        display:block;
        width:100%;
        padding:12px;
        background:#1d3557;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
    }
</style>
</head>

<body>

<h2>Penyaluran TPG, TKG dan Tamsil lingkup KPPN Painan</h2>

<!-- FILTER -->
<div class="filters">
    <select id="filterJenis">
        <option value="Semua">Semua Jns</option>
        <option value="TPG">TPG</option>
        <option value="TKG">TKG</option>
        <option value="Tamsil">Tamsil</option>
    </select>

    <select id="filterTw">
        <option value="Semua">Semua Trw</option>
        <option value="1">Triwulan I</option>
        <option value="2">Triwulan II</option>
        <option value="3">Triwulan III</option>
        <option value="4">Triwulan IV</option>
    </select>

    <select id="filterTh">
        <option value="2025">2025</option>
        <option value="2026">2026</option>
    </select>
</div>

<!-- LOADING BOX -->
<div id="loadingBox">⏳ Sedang memuat data...</div>

<!-- TABLE -->
<table>
    <thead>
        <tr>
            <th>Jenis</th>
            <th>Pagu</th>
            <th>Realisasi</th>
            <th>Realisasi s.d.</th>
            <th>Penerima</th>
            <th>PPh</th>
            <th>JKN</th>
            <th>Persentase</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<div class="charts-container">
    <div class="chartBox">
        <h3>Pagu vs Realisasi</h3>
        <canvas id="barChart"></canvas>
    </div>

    <div class="chartBox">
        <h3>Penerima</h3>
        <div class="pie-wrapper">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="chartBox">
        <h3>Realisasi vs PPh vs JKN</h3>
        <canvas id="pphChart"></canvas>
    </div>
</div>

<button class="btn" onclick="gotoDetail()">Cek Detil Data</button>


<script>
const API = "https://script.google.com/macros/s/AKfycbzBLUJwYz3AYMYOIvrQ0gJJXEU-sOsbHXSkgnDTBW34LTyBOY_UT9qt7WVBjJ7eChJ1Ug/exec";

let sheet1 = [];
let sheet2 = [];

let barChart, pieChart, pphChart;

function showLoading(){ document.getElementById("loadingBox").style.display = "block"; }
function hideLoading(){ document.getElementById("loadingBox").style.display = "none"; }

/* INITIAL LOAD */
window.onload = async () => {
    showLoading();
    await loadData();
    applyFilter();
    hideLoading();
};

/* LOAD DATA FROM API */
async function loadData(){
    try{
        const s1 = await fetch(API+"?mode=sheet1").then(r=>r.json());
        const s2 = await fetch(API+"?mode=sheet2").then(r=>r.json());

        sheet1 = s1.data || s1.sheet1 || [];
        sheet2 = s2.data || s2.sheet2 || [];

    }catch(err){
        console.error("Gagal load API:", err);
    }
}

/* FILTER WHEN SELECT CHANGED */
document.querySelectorAll("select").forEach(sel=>{
    sel.addEventListener("change", () => {
        showLoading();
        setTimeout(() => {
            applyFilter();
            hideLoading();
        }, 200);
    });
});

function parseTanggal(t){
    if(!t) return new Date("1900-01-01");
    if(t.includes("/")){
        let [d,m,y] = t.split("/");
        return new Date(`${y}-${m}-${d}`);
    }
    return new Date(t);
}

/* APPLY FILTER */
function applyFilter(){
    const jenis = document.getElementById("filterJenis").value;
    const tahun = document.getElementById("filterTh").value;
    const tw = document.getElementById("filterTw").value;

    let data = sheet1.filter(d=>{
        let tgl = parseTanggal(d["Tanggal SP2D"]);
        return String(tgl.getFullYear()) === tahun;
    });

    if(jenis !== "Semua")
        data = data.filter(d => d.Jenis === jenis);

    if(tw !== "Semua")
        data = data.filter(d => String(d.triwulan) === tw);

    renderTable(data);
    renderCharts(data);
}

/* RENDER TABLE WITH AKUMULASI */
function renderTable(data){
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    const tahun = document.getElementById("filterTh").value;
    const twFilter = document.getElementById("filterTw").value;

    let paguRow = sheet2.find(r => String(r.Tahun) === tahun) || {};

    let pagu = {
        TPG: Number(paguRow["Pagu TPG"] || 0),
        TKG: Number(paguRow["Pagu TKG"] || 0),
        Tamsil: Number(paguRow["Pagu Tamsil"] || 0),
    };

    let realTw = {
        TPG:{1:0,2:0,3:0,4:0},
        TKG:{1:0,2:0,3:0,4:0},
        Tamsil:{1:0,2:0,3:0,4:0}
    };

    sheet1.forEach(d=>{
        let tgl = parseTanggal(d["Tanggal SP2D"]);
        if(String(tgl.getFullYear()) !== tahun) return;

        let tw = Number(d.triwulan);
        let bruto = Number(String(d.Bruto).replace(/\D/g,"")) || 0;

        if(tw>=1 && tw<=4)
            realTw[d.Jenis][tw] += bruto;
    });

    let realSd = {TPG:0, TKG:0, Tamsil:0};
    let maxTw = twFilter === "Semua" ? 4 : Number(twFilter);

    ["TPG","TKG","Tamsil"].forEach(j=>{
        for(let i=1;i<=maxTw;i++){
            realSd[j] += realTw[j][i];
        }
    });

    let realisasi = {TPG:0, TKG:0, Tamsil:0};
    let penerima = {TPG:0, TKG:0, Tamsil:0};
    let pph = {TPG:0, TKG:0, Tamsil:0};
    let jkn = {TPG:0, TKG:0, Tamsil:0};

    data.forEach(d=>{
        let bruto = Number(String(d.Bruto).replace(/\D/g,"")) || 0;
        realisasi[d.Jenis] += bruto;

        penerima[d.Jenis] += Number(d.Jml) || 0;
        pph[d.Jenis] += Number(String(d.PPh).replace(/\D/g,"")) || 0;
        jkn[d.Jenis] += Number(String(d.Jkn).replace(/\D/g,"")) || 0;
    });

    ["TPG","TKG","Tamsil"].forEach(j=>{
        let pg = pagu[j];
        let rl = realisasi[j];
        let rlSdVal = realSd[j];
        let jml = penerima[j];
        let pot1 = pph[j];
        let pot2 = jkn[j];
        let persen = pg>0 ? ((rlSdVal/pg)*100).toFixed(1)+"%" : "-";

        tbody.innerHTML += `
            <tr>
                <td>${j}</td>
                <td>${pg.toLocaleString()}</td>
                <td>${rl.toLocaleString()}</td>
                <td>${rlSdVal.toLocaleString()}</td>
                <td>${jml.toLocaleString()}</td>
                <td>${pot1.toLocaleString()}</td>
                <td>${pot2.toLocaleString()}</td>
                <td>${persen}</td>
            </tr>
        `;
    });
}

/* GRAFIK — REALISASI DIAMBIL DARI REALISASI S.D. TW */
function renderCharts(data){
    const tahun = document.getElementById("filterTh").value;
    const twFilter = document.getElementById("filterTw").value;

    let realTw = {
        TPG:{1:0,2:0,3:0,4:0},
        TKG:{1:0,2:0,3:0,4:0},
        Tamsil:{1:0,2:0,3:0,4:0}
    };

    sheet1.forEach(d=>{
        let tgl = parseTanggal(d["Tanggal SP2D"]);
        if(String(tgl.getFullYear()) !== tahun) return;

        let tw = Number(d.triwulan);
        let bruto = Number(String(d.Bruto).replace(/\D/g,"")) || 0;

        if(tw>=1 && tw<=4){
            realTw[d.Jenis][tw] += bruto;
        }
    });

    let maxTw = twFilter === "Semua" ? 4 : Number(twFilter);
    let realSd = {TPG:0, TKG:0, Tamsil:0};

    ["TPG","TKG","Tamsil"].forEach(j=>{
        for(let i=1;i<=maxTw;i++){
            realSd[j] += realTw[j][i];
        }
    });

    let penerima = {TPG:0, TKG:0, Tamsil:0};
    let pph = {TPG:0, TKG:0, Tamsil:0};
    let jkn = {TPG:0, TKG:0, Tamsil:0};

    sheet1.forEach(d=>{
        let tgl = parseTanggal(d["Tanggal SP2D"]);
        if(String(tgl.getFullYear()) !== tahun) return;

        let tw = Number(d.triwulan);
        if(tw > maxTw) return;

        penerima[d.Jenis] += Number(d.Jml) || 0;
        pph[d.Jenis] += Number(String(d.PPh).replace(/\D/g,"")) || 0;
        jkn[d.Jenis] += Number(String(d.Jkn).replace(/\D/g,"")) || 0;
    });

    let paguRow = sheet2.find(r => String(r.Tahun) === tahun) || {};
    let pagu = [
        Number(paguRow["Pagu TPG"] || 0),
        Number(paguRow["Pagu TKG"] || 0),
        Number(paguRow["Pagu Tamsil"] || 0)
    ];

    if(barChart) barChart.destroy();
    barChart = new Chart(document.getElementById("barChart"), {
        type:"bar",
        data:{
            labels:["TPG","TKG","Tamsil"],
            datasets:[
                { label:"Pagu", data:pagu, backgroundColor:"#8ecae6" },
                { label:"Realisasi s.d. TW", data:[realSd.TPG,realSd.TKG,realSd.Tamsil], backgroundColor:"#1d3557" }
            ]
        }
    });

    if(pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById("pieChart"), {
        type:"pie",
        data:{
            labels:["TPG","TKG","Tamsil"],
            datasets:[
                { data:[penerima.TPG,penerima.TKG,penerima.Tamsil],
                  backgroundColor:["#1d3557","#457b9d","#a8dadc"] }
            ]
        }
    });

    if(pphChart) pphChart.destroy();
    pphChart = new Chart(document.getElementById("pphChart"), {
        type:"bar",
        data:{
            labels:["TPG","TKG","Tamsil"],
            datasets:[
                { label:"Realisasi s.d. TW", data:[realSd.TPG,realSd.TKG,realSd.Tamsil], backgroundColor:"#1d3557" },
                { label:"PPh", data:[pph.TPG,pph.TKG,pph.Tamsil], backgroundColor:"#e76f51" },
                { label:"JKN", data:[jkn.TPG,jkn.TKG,jkn.Tamsil], backgroundColor:"#2a9d8f" }
            ]
        }
    });
}

function gotoDetail(){
    window.location.href = "login.html";
}
</script>

</body>
</html>
