<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Data SP2D</title>
<link rel="stylesheet" href="style.css">

<script>
// =============================
// PROTEKSI HALAMAN
// =============================
if (sessionStorage.getItem("logged") !== "yes") {
    location.href = "login.html";
}
if (sessionStorage.getItem("role") !== "Admin") {
    location.href = "rincian.html";
}
</script>

<style>
/* Tambahan agar sesuai style rincian2.html */
.page-title {
    text-align:center;
    font-size:26px;
    font-weight:bold;
    margin-top:10px;
    margin-bottom:15px;
}

.card {
    background:white;
    border-radius:16px;
    padding:25px;
    max-width:650px;
    margin:auto;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
}

.btn {
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.btn-primary { background:#007bff; color:white; }
.btn-primary:hover { background:#0069d9; }

.btn-danger { background:#dc3545; color:white; }
.btn-danger:hover { background:#bb2d3b; }

.btn-back { background:#6c757d; color:white; }
.btn-back:hover { background:#5a6268; }

input, select {
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #d0d4d9;
    margin-top:5px;
    margin-bottom:15px;
    font-size:15px;
}

label {
    font-weight:600;
}

.success, .error {
    padding:12px;
    border-radius:8px;
    font-weight:600;
    text-align:center;
    margin-top:15px;
}
.success { background:#d4edda; color:#155724; }
.error   { background:#f8d7da; color:#721c24; }

/* Responsif */
@media(max-width:600px){
    .card { padding:20px; }
    .btn { width:100%; margin-top:8px; }
}
</style>

</head>
<body>

<!-- Tombol kembali & logout -->
<div style="display:flex; justify-content:center; gap:10px; margin:20px;">
    <button class="btn btn-back" onclick="location.href='rincian2.html'">⬅ Kembali</button>
    <button class="btn btn-back" onclick="logout()">Logout</button>
</div>

<div class="page-title">Input Data SP2D</div>

<div class="card">

    <label>Jenis</label>
    <select id="jenis">
        <option value="TPG">TPG</option>
        <option value="TKG">TKG</option>
        <option value="Tamsil">Tamsil</option>
    </select>

    <label>Triwulan</label>
    <select id="triwulan">
        <option value="1">Triwulan 1</option>
        <option value="2">Triwulan 2</option>
        <option value="3">Triwulan 3</option>
        <option value="4">Triwulan 4</option>
    </select>

    <label>Nomor SP2D</label>
    <input type="text" id="nomorSp2d" placeholder="Masukkan nomor SP2D">

    <label>Tanggal SP2D</label>
    <input type="date" id="tanggalSp2d">

    <label>Bruto</label>
    <input type="text" id="bruto" placeholder="Contoh: 57541800">

    <label>PPh</label>
    <input type="text" id="pph" placeholder="Contoh: 4401000">

    <label>Jkn</label>
    <input type="text" id="jkn" placeholder="Contoh: 100000">

    <label>Jml</label>
    <input type="number" id="jml" placeholder="Contoh: 40">

    <label>Link Drive Penerima</label>
    <input type="text" id="link" placeholder="Masukkan link Google Drive">

    <button class="btn btn-primary" onclick="kirimData()">Simpan Data</button>

    <div id="notif"></div>
</div>

<script>
function kirimData() {
    const url = "https://script.google.com/macros/s/AKfycbz-nf6nWZ2y5GOXKFG5Ja9g60Wf2vB4OYBS3rrdw9zrCa5m1_Ajb_P-0A-owQVaExpJ_g/exec";

    const data = {
        jenis: document.getElementById("jenis").value,
        triwulan: document.getElementById("triwulan").value,
        nomorSp2d: document.getElementById("nomorSp2d").value.trim(),
        tanggalSp2d: document.getElementById("tanggalSp2d").value,
        bruto: document.getElementById("bruto").value,
        pph: document.getElementById("pph").value,
        jkn: document.getElementById("jkn").value,
        jml: document.getElementById("jml").value,
        link: document.getElementById("link").value.trim()
    };

    // Validasi sederhana
    if (!data.nomorSp2d || !data.tanggalSp2d || !data.bruto) {
        document.getElementById("notif").innerHTML =
            "<div class='error'>Harap isi Nomor SP2D, Tanggal dan Bruto!</div>";
        return;
    }

    fetch(url, {
        method: "POST",
        contentType: "application/json",
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(response => {
        document.getElementById("notif").innerHTML =
            `<div class='success'>${response}</div>`;

        // Tunggu 1.5 detik lalu pindah ke rincian2.html
        setTimeout(() => {
            location.href = "rincian2.html";
        }, 1500);
    })
    .catch(err => {
        document.getElementById("notif").innerHTML =
            `<div class='error'>Terjadi kesalahan: ${err}</div>`;
    });
}

function logout() {
    sessionStorage.clear();
    location.href = "login.html";
}
</script>

</body>
</html>
