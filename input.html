<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Data SP2D</title>
<style>
    body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #eef1f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        background: #ffffff;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 560px;
        animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-size: 22px;
    }
    label {
        font-weight: 600;
        margin-top: 12px;
        display: block;
        color: #444;
    }
    input, select {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #cfd3d8;
        font-size: 15px;
        background: #fafafa;
        transition: 0.2s ease;
    }
    input:focus, select:focus {
        border-color: #0d6efd;
        background: #fff;
        box-shadow: 0 0 4px rgba(13,110,253,0.3);
        outline: none;
    }
    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #007bff, #0056b3);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 25px;
        transition: 0.3s ease;
    }
    button:hover {
        background: linear-gradient(135deg, #006ae6, #004a9c);
    }
    .success, .error {
        margin-top: 18px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        font-weight: 600;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<div class="container">
    <h2>Form Input Data SP2D</h2>

    <label>Jenis</label>
    <select id="jenis">
        <option value="TPG">TPG</option>
        <option value="TKG">TKG</option>
        <option value="Tamsil">Tamsil</option>
    </select>

    <label>Nomor SP2D</label>
    <input type="text" id="nomorSp2d" placeholder="Masukkan nomor SP2D">

    <label>Tanggal SP2D</label>
    <input type="date" id="tanggalSp2d">

    <label>Bruto</label>
    <input type="text" id="bruto" placeholder="Contoh: 57,541,800">

    <label>PPh</label>
    <input type="text" id="pph" placeholder="Contoh: 4,401,000">

    <label>Jkn</label>
    <input type="text" id="jkn" placeholder="Contoh: 100000">

    <label>Jml</label>
    <input type="number" id="jml" placeholder="Contoh: 40">

    <label>Link Drive Penerima</label>
    <input type="text" id="link" placeholder="Masukkan link Google Drive">

    <button onclick="kirimData()">Simpan Data</button>

    <div id="notif"></div>
</div>

<script>
function kirimData() {
    const url = "https://script.google.com/macros/s/AKfycbz5bt9vf52TdRlJn0d7YtbWAitNb660YRxE86uDIAqoiVeqPx3HKfgsfZN55CpiKdFSwg/exec";

    const data = {
        jenis: document.getElementById("jenis").value,
        nomorSp2d: document.getElementById("nomorSp2d").value,
        tanggalSp2d: document.getElementById("tanggalSp2d").value,
        bruto: document.getElementById("bruto").value,
        pph: document.getElementById("pph").value,
        jkn: document.getElementById("jkn").value,
        jml: document.getElementById("jml").value,
        link: document.getElementById("link").value
    };

    fetch(url, {
        method: "POST",
        contentType: "application/json",
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(response => {
        document.getElementById("notif").innerHTML = `<div class='success'>${response}</div>`;
    })
    .catch(err => {
        document.getElementById("notif").innerHTML = `<div class='error'>Terjadi kesalahan: ${err}</div>`;
    });
}
</script>

</body>
</html>
